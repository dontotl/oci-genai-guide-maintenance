<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=./catalog.html">
  <link rel="canonical" href="./catalog.html">
  <title>OCI AI Region Catalog</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8f9;
      --panel: #ffffff;
      --text: #1d252d;
      --muted: #5f6b76;
      --line: #d8dde3;
      --accent: #0f6b6e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(520px, calc(100% - 32px));
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    a {
      color: var(--accent);
      font-weight: 700;
    }
  </style>
  <script>
    window.location.replace('./catalog.html');
  </script>
</head>
<body>
  <main>
    <h1>OCI AI Region Catalog</h1>
    <p>카탈로그 화면으로 이동 중입니다.</p>
    <a href="./catalog.html">catalog.html 열기</a>
  </main>
</body>
</html>
